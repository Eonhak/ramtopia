name: ramtopia
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your public HTTPS URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TRUST_PROXY: "1"
      DATABASE_PATH: /app/data/ramtopia.sqlite
    volumes:
      - accounts:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  accounts:
