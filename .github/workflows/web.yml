name: Deploy Web Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test game interactions in Chromium
        run: |
          npm run dev -- --port 3000 > /tmp/ramtopia-vite.log 2>&1 &
          game_server_pid=$!
          trap 'kill "$game_server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm test
      - run: npm run build
      # Publish via a branch without using Actions artifact storage.
      - name: Publish website to gh-pages
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
