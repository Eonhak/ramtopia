name: Build Windows Game

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Upload Windows executable and required files
        uses: actions/upload-artifact@v4
        with:
          name: RAMTOPIA-Windows-x64
          path: release/RAMTOPIA-win32-x64/
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RAMTOPIA-Windows-x64
          path: RAMTOPIA-Windows-x64
      - name: Create ZIP
        run: zip -r RAMTOPIA-Windows-x64.zip RAMTOPIA-Windows-x64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          RAMTOPIA-Windows-x64.zip
          --repo "$GITHUB_REPOSITORY"
          --title "RAMTOPIA $GITHUB_REF_NAME"
          --notes "Windows 10/11 64비트용입니다. ZIP 전체를 압축 해제하고 RAMTOPIA.exe를 실행하세요. 동봉 파일을 함께 보관해야 합니다."
