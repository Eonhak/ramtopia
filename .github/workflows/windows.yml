name: Build Windows Game

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - name: Create Windows ZIP
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Compress-Archive -Path release/RAMTOPIA-win32-x64 -DestinationPath release/RAMTOPIA-Windows-x64.zip -Force
      - name: Publish directly to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" release/RAMTOPIA-Windows-x64.zip --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:RELEASE_TAG" release/RAMTOPIA-Windows-x64.zip --target "$env:GITHUB_SHA" --repo "$env:GITHUB_REPOSITORY" --title "RAMTOPIA $env:RELEASE_TAG" --notes "Windows 10/11 64-bit. Extract the entire ZIP, then run RAMTOPIA.exe. Keep all included files together."
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }
