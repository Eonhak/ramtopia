<!doctype html><meta charset="utf-8"><script type="module">
import * as T from 'three';import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});renderer.setSize(128,160);renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;const scene=new T.Scene();scene.add(new T.HemisphereLight('#f3f2df','#627b77',1.8));const sun=new T.DirectionalLight('#fff3db',2.1);sun.position.set(-4,9,6);scene.add(sun);const camera=new T.OrthographicCamera(-1.2,1.2,1.5,-1.5,.1,30);camera.position.set(2,2.3,5);camera.lookAt(0,1.05,0);const loader=new GLTFLoader();
window.renderAnimalIcon=async(nation,kind)=>{const asset=await loader.loadAsync('/animal-preview/models/'+nation+'/'+kind+'.glb');const root=asset.scene;root.rotation.y=.1;root.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(root);root.scale.multiplyScalar(Math.min(1,2.35/bounds.max.y));scene.add(root);const mixer=new T.AnimationMixer(root);asset.animations.forEach(c=>mixer.clipAction(c).play());const sheet=document.createElement('canvas');sheet.width=128*9;sheet.height=160;const c=sheet.getContext('2d');let i=0;for(const t of [0,2.28,2.44,2.59,2.75,4.45,4.7,4.95,5.2]){mixer.setTime(t);renderer.render(scene,camera);c.drawImage(renderer.domElement,i++*128,0)}scene.remove(root);root.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of (Array.isArray(o.material)?o.material:[o.material]))m.dispose()}});mixer.stopAllAction();return sheet.toDataURL('image/png').split(',')[1]};
</script>
